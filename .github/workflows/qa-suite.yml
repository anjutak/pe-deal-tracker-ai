name: QA suite

on:
  push:
    paths: ["qa-suite/**", ".github/workflows/qa-suite.yml"]
  pull_request:
    paths: ["qa-suite/**", ".github/workflows/qa-suite.yml"]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run the live suite against LANGFLOW_URL (needs repository secrets)"
        type: boolean
        default: false

jobs:
  selftests:
    name: Self-tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qa-suite/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check golden dataset against the CSV, and the harness against a fake Langflow
        run: pytest selftests -v --junitxml=selftests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: qa-suite/selftests.xml

  live:
    name: Live suite (Langflow + Claude judge)
    needs: selftests
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-suite
    env:
      LANGFLOW_URL: ${{ secrets.LANGFLOW_URL }}
      LANGFLOW_API_KEY: ${{ secrets.LANGFLOW_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qa-suite/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check secrets
        run: |
          if [ -z "$LANGFLOW_URL" ] || [ -z "$LANGFLOW_API_KEY" ]; then
            echo "::error::Add LANGFLOW_URL and LANGFLOW_API_KEY as repository secrets (the flow must be reachable from the internet)."
            exit 1
          fi
      - name: Run golden cases (keyword checks + Claude judge)
        run: pytest -v -rA --html=report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: |
            qa-suite/report.html
            qa-suite/results/
